                <ul>
                    <li><i class="fa-solid fa-check"></i> Research proposals for college & university students</li>
                    <li><i class="fa-solid fa-check"></i> Research project preparation and formatting</li>
                    <li><i class="fa-solid fa-check"></i> Academic document editing and presentation support</li>
                    <li><i class="fa-solid fa-check"></i> Computer Science project guidance</li>
                </ul>
            </div>

            <!-- Service 3 -->
            <div class="service-card card-purple">
                <i class="fa-solid fa-mobile-screen-button service-icon"></i>
                <h3>App & Website Development</h3>
                <ul>
                    <li><i class="fa-solid fa-check"></i> Mobile application development</li>
                    <li><i class="fa-solid fa-check"></i> Website design and development</li>
                    <li><i class="fa-solid fa-check"></i> Computer Science student projects</li>
                    <li><i class="fa-solid fa-check"></i> Digital solutions for businesses and individuals</li>
                </ul>
            </div>

            <!-- Service 4 (Ethio Coders) -->
            <div class="service-card card-orange ethio-coders-box">
                <i class="fa-solid fa-code service-icon"></i>
                <h3>Ethio Coders</h3>
                <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem;">We make for you</p>
                <h4 style="color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem;">Ethio Coders Assignments</h4>
                <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem;">Completed with official certification.</p>
                <div class="ethio-logo-badge">
                    <i class="fa-solid fa-code-branch"></i> ETHIO CODERS
                </div>
            </div>

        </div>
    </section>

    <!-- WHY CHOOSE US -->
    <section id="why-us" class="why-us">
        <h2>Why Choose Us?</h2>
        <div class="features-grid">
            <div class="feature-item">
                <i class="fa-solid fa-user-tie"></i>
                <h4>Professional Service</h4>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-headset"></i>
                <h4>Reliable Technical Support</h4>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                <h4>Affordable Solutions</h4>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-award"></i>
                <h4>Quality-Focused Work</h4>
            </div>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact" class="contact-section">
        <div class="contact-box">
            <div class="contact-info">
                <div class="contact-icon">
                    <i class="fa-solid fa-phone-volume"></i>
                </div>
                <div class="contact-text">
                    <h4>Contact Us Today</h4>
                    <div class="phone-numbers">0969481003 / 0716528416</div>
                </div>
            </div>
            <div class="contact-tagline">
                "Your Trusted Partner for Software, Research & Digital Innovation."
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 ABDU Software & Business Center. All Rights Reserved.</p>
    </footer>

</body>
</html>
