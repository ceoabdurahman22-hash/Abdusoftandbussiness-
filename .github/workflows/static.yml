                    <li><i class="fa-solid fa-check"></i> Microsoft Office 2016, 2019, 2021 & 2024</li>
                    <li><i class="fa-solid fa-check"></i> Windows 7, 10 & 11</li>
                    <li><i class="fa-solid fa-check"></i> Adobe Premiere Pro, After Effects & graphics software</li>
                    <li><i class="fa-solid fa-check"></i> AutoCAD, SketchUp, 3ds Max & architectural software</li>
                    <li><i class="fa-solid fa-check"></i> Avast, Smadav, 360 Total Security & antivirus solutions</li>
                </ul>
            </div>

            <!-- Service 2 -->
            <div class="service-card card-green">
                <i class="fa-solid fa-graduation-cap service-icon"></i>
